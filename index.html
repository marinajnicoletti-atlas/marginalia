<style>
:root{--bg:#efe3cb;--bg2:#e2d0aa;--glow:rgba(255,214,140,.4);--card:#fbf6ea;--ink:#2d2016;--mut:#7b6850;--acc:#b8862b;--pl:#2e4a3b;--onpl:#fff;--bd:#d8c7a2;--back:#cdb98f;--w1:#8a5a36;--w2:#4f311b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a110a;--bg2:#0e0905;--glow:rgba(255,180,80,.13);--card:#261a10;--ink:#f1e4c7;--mut:#b49e7c;--acc:#dba844;--pl:#86b896;--onpl:#10201a;--bd:#44311f;--back:#2a1b10;--w1:#6b4528;--w2:#3a2312;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a110a;--bg2:#0e0905;--glow:rgba(255,180,80,.13);--card:#261a10;--ink:#f1e4c7;--mut:#b49e7c;--acc:#dba844;--pl:#86b896;--onpl:#10201a;--bd:#44311f;--back:#2a1b10;--w1:#6b4528;--w2:#3a2312;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -5%,var(--glow),transparent 60%),linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font:16px/1.5 var(--bf,'Instrument Sans'),system-ui,sans-serif}
h1,h2,h3,blockquote,.logo{font-family:var(--hf,Fraunces),Georgia,serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:linear-gradient(#4b2f1b,#2c1a0e);color:#f3e6c9;border-bottom:3px solid var(--acc);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.logo{font-size:26px;font-weight:700;font-style:italic;margin-right:auto;color:#f3d38a;text-decoration:none}.logo::before{content:"❦ ";color:var(--acc)}
main{max-width:1080px;margin:0 auto;padding:20px}
button,.btn,.btn2,select,input,textarea{font:inherit;color:inherit}
.btn,.btn2,button.t{border:1px solid var(--bd);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-block}
.btn{background:var(--acc);color:var(--onacc,#2a1a08);border-color:var(--acc);font-weight:600}
header .btn2,header select{background:rgba(255,255,255,.08);border-color:rgba(243,230,201,.35);color:#f3e6c9}header select option{color:#2d2016;background:#fbf6ea}
header .menu button.t{color:var(--ink)}header .lg{width:auto;padding:7px 8px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input{flex:1;min-width:180px}.tools select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:14px;background:var(--card);cursor:pointer}.chip.on{background:var(--pl);color:var(--onpl);border-color:var(--pl)}
.plaques{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}.plaque{background:linear-gradient(#e0bd6b,#b8862b);color:#2a1a08;border-radius:4px;padding:4px 12px;font-weight:600;font-size:13px;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.35)}.plaque b{opacity:.65;margin-left:4px}
.room{margin:30px 0 8px}.room-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}.room-h h2{margin:0;font-size:22px}.room-h h2 a{color:inherit;text-decoration:none}.room-h .n{color:var(--mut);font-size:14px}.open{margin-left:auto;color:var(--pl);font-weight:600;text-decoration:none;font-size:14px}
.shelf{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 0;background:linear-gradient(var(--back),color-mix(in srgb,var(--back) 70%,#000));border-radius:6px 6px 0 0;box-shadow:inset 0 8px 14px rgba(0,0,0,.25);scrollbar-width:thin}.shelf .bk{flex:0 0 100px}.shelf .m{display:none}
.wood{height:16px;background:linear-gradient(var(--w1),var(--w2));box-shadow:0 8px 10px -6px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 22px}
.sf{position:relative}.grid .sf{margin-bottom:16px}.grid .sf::after{content:'';position:absolute;left:-11px;right:-11px;bottom:-14px;height:14px;background:linear-gradient(var(--w1),var(--w2));box-shadow:0 5px 8px -4px rgba(0,0,0,.5)}.grid .m{margin-top:4px}
.bk{text-decoration:none;color:inherit;display:block}.cv{position:relative;aspect-ratio:2/3;border-radius:3px 8px 8px 3px;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.4);overflow:hidden}
.cv::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.14) 6%,transparent 13%);pointer-events:none}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv b{font:700 15px/1.2 Fraunces,Georgia,serif}.cv i{font-size:11px;opacity:.85}
.m{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}.m span{color:var(--acc)}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:48px 24px;text-align:center;margin-top:20px;background:var(--card)}.drop.over{border-color:var(--acc)}

.sm{color:var(--mut);font-size:14px}code{background:var(--bd);padding:1px 6px;border-radius:4px}
.bhead{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start}.bhead h1,.rh{margin:4px 0 0;font-size:30px;line-height:1.15}
.back{color:var(--mut);text-decoration:none;font-size:14px}.st{background:none;border:0;color:var(--acc);font-size:24px;cursor:pointer;padding:0 1px}
.gsel label{display:flex;gap:8px;align-items:center}.gsel select{width:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin:10px 0}.bars i{width:10px;background:var(--pl);border-radius:2px 2px 0 0}
.club{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin:20px 0}.club h2{margin:0 0 8px;font-size:20px}
.club li{margin:4px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hl{background:var(--card);border-left:4px solid var(--bd);border-radius:6px;padding:14px 18px;margin:12px 0;box-shadow:0 3px 10px rgba(60,30,10,.1)}.hl.pin{border-left-color:var(--acc)}
blockquote{margin:0;font-size:18px;line-height:1.55;white-space:pre-wrap;font-style:italic}.note{color:var(--pl);margin:8px 0 0}.cm{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--bd);font-size:15px}.by{font-size:13px;color:var(--pl)}
.hl footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--mut);font-size:13px}.hl footer button{background:none;border:0;cursor:pointer;font-size:16px;padding:2px 5px;color:var(--ink)}
h3{font-size:16px;color:var(--mut);margin:26px 0 0}
#modal{position:fixed;inset:0;background:rgba(20,10,4,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#modal[hidden]{display:none}
.box{background:var(--card);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--acc)}.box label{display:block;margin-top:8px;font-size:14px;color:var(--mut)}.cardimg{width:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2c1a0e;color:#f3e6c9;border:1px solid var(--acc);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}#toast.on{opacity:1}
details.menu{position:relative}details.menu summary{list-style:none;cursor:pointer}.menu div{position:absolute;right:0;top:40px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;display:grid;gap:6px;min-width:210px;z-index:5;color:var(--ink)}
@media(max-width:600px){.bhead{grid-template-columns:110px 1fr;gap:14px}.bhead h1,.rh{font-size:23px}}

.spines{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:3px;padding:0 14px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(to bottom,transparent 0 200px,var(--w1) 200px 208px,var(--w2) 208px 216px),var(--back);box-shadow:inset 0 10px 16px rgba(0,0,0,.25)}
.sw{height:216px;padding-bottom:16px;display:flex;align-items:flex-end}
.spine{writing-mode:vertical-rl;height:var(--h);width:var(--w);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:26px 3px;position:relative;overflow:hidden;color:#f3e6c9;text-decoration:none;font-family:Fraunces,Georgia,serif;border-radius:2px 2px 1px 1px;box-shadow:inset 2px 0 3px rgba(255,255,255,.14),inset -3px 0 5px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.4);transition:transform .2s}
.spine span{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:68%;min-height:0}.spine i{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;max-height:24%}
.spine::before,.spine::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--acc);opacity:.75}.spine::before{top:10px}.spine::after{bottom:10px}
.sw:hover .spine,.spine:focus-visible,.spine.on{transform:translateY(-14px)}
.stage{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:linear-gradient(135deg,#23382c,#15241b);color:#f3e6c9;border:1px solid var(--acc);border-radius:12px;padding:18px 22px;margin:0 0 18px;min-height:210px;box-shadow:inset 0 0 0 4px rgba(184,134,43,.22),0 6px 16px rgba(0,0,0,.25)}
.stage .sc{flex:0 0 110px;cursor:pointer}.stage h2{margin:2px 0;font-size:24px;line-height:1.15}.stage .sm{color:#cdbb97}.stage .am{color:var(--acc)}.stage .si{flex:1;min-width:200px}.stage small{opacity:.8}
#opn{position:fixed;inset:0;z-index:20;background:rgba(15,8,3,.8);display:flex;align-items:center;justify-content:center;perspective:1400px;opacity:0;transition:opacity .15s;overflow:hidden}#opn.go{opacity:1}
.bk3{position:relative;width:min(220px,50vw);aspect-ratio:2/3;transform-style:preserve-3d;transform:scale(1) translateX(0);transition:transform .5s cubic-bezier(.4,0,.2,1)}.go .bk3{transform:scale(1) translateX(50%)}#opn.zm .bk3{transform:scale(var(--z,6)) translateX(50%);transition:transform .34s cubic-bezier(.6,.05,.4,1)}#opn.end{opacity:0;transition:opacity .22s}
.pgs,.fc .inner{position:absolute;inset:0;border-radius:2px 8px 8px 2px;background:repeating-linear-gradient(var(--card) 0 20px,var(--bd) 20px 21px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fc{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.6,0,.2,1)}.go .fc{transform:rotateY(-172deg)}
.fc .cv{position:absolute;inset:0;height:100%;aspect-ratio:auto;backface-visibility:hidden}.fc .inner{transform:rotateY(180deg);backface-visibility:hidden;border-radius:8px 2px 2px 8px}
.turn{animation:turn .9s ease-out;transform-origin:left center}@keyframes turn{from{transform:perspective(1400px) rotateY(-70deg);opacity:.2}to{transform:perspective(1400px) rotateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.turn{animation:none}}
#list,.pg2{background:var(--card);padding:18px 34px 24px 44px;border-radius:3px 10px 10px 3px;box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.45),2px 0 0 var(--card),3px 0 0 var(--bd),5px 1px 0 var(--card),6px 1px 0 var(--bd),0 12px 26px rgba(0,0,0,.25)}
#list .hl,.pg2 .hl{background:none;box-shadow:none;border-left:0;border-radius:0;border-bottom:1px dotted var(--bd);padding:16px 0;margin:0}#list .hl.pin{box-shadow:inset 3px 0 0 var(--acc);padding-left:14px}
#list .hl:first-child blockquote::first-letter{font-size:2.6em;float:left;line-height:.9;padding:4px 6px 0 0;color:var(--acc)}

.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin:6px 0 18px}.hero h1{font:italic 700 clamp(30px,5vw,46px)/1 Fraunces,Georgia,serif;margin:0}
.hs{display:flex;gap:10px;flex:1;min-width:260px;max-width:560px}.hs input{border-radius:30px;padding:11px 18px;font-size:16px;box-shadow:0 2px 8px rgba(60,30,10,.15)}.hs .btn{white-space:nowrap;border-radius:30px}
.wall{position:relative;background:radial-gradient(ellipse at 50% 0,rgba(255,200,120,.28),transparent 65%),linear-gradient(#2e1c10,#1b0f08);border:10px solid #5a3a22;border-radius:10px;padding:26px 14px 0;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 18px 40px rgba(0,0,0,.4);overflow:hidden;margin-bottom:18px}
.wall .spines{background:repeating-linear-gradient(to bottom,transparent 0 268px,#8a5a36 268px 276px,#4f311b 276px 284px);box-shadow:none;border-radius:0;padding:0 4px}.wall .sw{height:284px}
.wall .room-h{padding:0 8px}.wall .room-h h2,.wall .room-h h2 a{color:#f3d38a}.wall .room-h .n,.wall .m{color:#cdbb97}.wall .open{color:#e6c274}.wall .room{margin:0 0 6px}.wall .grid{padding-bottom:10px}
@keyframes rise{from{opacity:0;transform:translateY(70px) rotate(4deg)}}.in .spine{animation:rise .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms) backwards}
#dres .pg{background:var(--card);border-radius:3px 10px 10px 3px;padding:16px 20px;margin-top:14px;box-shadow:inset 10px 0 14px -10px rgba(0,0,0,.4)}#dres blockquote{font-size:17px}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;max-width:1120px;margin:0 auto;padding:14px 22px 0;background:none;border:0;box-shadow:none;color:var(--ink)}
.logo{color:var(--ink);font-size:24px;margin:0}.logo::before{content:none}
.gear{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;border-radius:50%;display:flex}.gear:hover{color:var(--ink)}
.hero{justify-content:center;margin:6px 0 22px}.hs{max-width:640px;width:100%;align-items:center;flex:none;gap:4px}.hs input{flex:1}
.lk{background:none;border:0;color:var(--mut);padding:8px 10px;cursor:pointer;border-bottom:1px solid transparent;white-space:nowrap}.lk:hover{color:var(--ink);border-color:var(--acc)}
.set{display:block;width:100%;text-align:left;padding:13px 4px;border:0;border-bottom:1px solid var(--bd);background:none;cursor:pointer;font-size:16px;color:var(--ink)}.set:hover{color:var(--acc)}
.spine{color:var(--fg)}.spine::before,.spine::after{background:var(--ac)}.spine i{font-family:'Instrument Sans',sans-serif;font-style:normal;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.k1::before,.k1::after{height:6px;background:none;border-block:1px solid var(--ac)}.k2 span{box-shadow:0 0 0 1px var(--ac);padding:6px 2px;background:rgba(255,255,255,.1)}
.sw:hover .spine{transform:translateY(-8px)}
#pop{position:fixed;z-index:15;pointer-events:none;opacity:0;transform-origin:left center}#pop .cv{height:100%;aspect-ratio:auto;box-shadow:0 14px 30px rgba(0,0,0,.55)}
#pop.on{opacity:1;animation:pull .35s cubic-bezier(.2,.8,.2,1)}@keyframes pull{from{transform:perspective(900px) rotateY(-75deg) translateX(-6px);opacity:.3}to{transform:perspective(900px) rotateY(0)}}
.hl footer button{font-size:13px;color:var(--mut)}.hl footer button[data-a=f]{font-size:17px;color:var(--acc)}

header{justify-content:flex-start;align-items:baseline;gap:6px}.logo{margin-right:16px}.gear{margin-left:auto;align-self:center}
.hs{max-width:560px}.hs input{flex:1}
.qd{display:none;max-width:760px;margin:0 auto 24px;position:relative;padding:24px 34px;text-align:center;border-block:1px solid var(--bd)}.qd.open{display:block;animation:qin .45s ease}
@keyframes qin{from{opacity:0;transform:translateY(-12px)}}
.qd blockquote{font-size:22px;line-height:1.5;margin:0 0 8px}.qx{position:absolute;right:0;top:4px;font-size:20px}
.qt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px;align-items:center}.qt input,.qt select{width:auto;min-width:150px;padding:5px 12px;font-size:14px;border-radius:20px}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--card);border-left:1px solid var(--acc);box-shadow:-12px 0 30px rgba(0,0,0,.35);padding:14px 22px 22px;overflow:auto;transform:translateX(105%);visibility:hidden;transition:transform .3s,visibility .3s;z-index:12}#drw.open{transform:none;visibility:visible}
#dbk{position:fixed;inset:0;background:rgba(15,8,3,.45);z-index:11}#dbk[hidden]{display:none}.dh{display:flex;justify-content:flex-end;margin-bottom:-6px}

header{align-items:center;gap:14px;flex-wrap:nowrap}.logo{flex:none;white-space:nowrap;margin-right:6px}
header .hs{flex:1 1 auto;width:auto;min-width:80px;max-width:560px;margin:0 auto}header .hs input{padding:7px 16px;border-radius:30px;font-size:15px}
header .lk,header .gear{flex:none;margin:0;align-self:center}header .lk{padding:7px 8px}
.inb header .hs{visibility:hidden}
.kz{border:2px dashed var(--bd);border-radius:12px;padding:28px 16px;text-align:center;display:grid;gap:10px;justify-items:center;margin:14px 0}.kz.over{border-color:var(--acc);background:rgba(184,134,43,.1)}
@media(max-width:520px){.logo{font-size:19px}header{gap:8px;padding-inline:14px}}

.qd h3{margin:0 0 4px;text-align:center;font:600 13px 'Instrument Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.qf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;text-align:left;margin-top:16px}.qf label{display:grid;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.qf input,.qf select{width:100%;font-size:14px;border-radius:8px;padding:7px 10px;letter-spacing:0;text-transform:none;color:var(--ink)}
.qa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;align-items:center}
.set{display:flex;align-items:center;gap:14px}.set .ic{width:20px;height:20px;flex:none;color:var(--mut)}.set:hover .ic{color:var(--acc)}.set.go::after{content:'›';margin-left:auto;color:var(--mut);font-size:20px}
.kz .ic{width:30px;height:30px;color:var(--mut)}
/* ---------- ícones ---------- */
.ic{width:18px;height:18px;flex:none}
header .logo{display:inline-flex;align-items:center;gap:9px}header .logo .ic{width:22px;height:22px;color:var(--acc)}
header .lk,.lk .ic+span{display:inline-flex;align-items:center}header .lk{gap:7px}header .lk .ic{width:17px;height:17px}
.note{display:flex;gap:8px;align-items:flex-start}.note .ic{width:14px;height:14px;margin-top:5px}

/* ---------- sortear trecho ---------- */
.qd{max-width:640px;text-align:center;border:0;border-radius:3px 10px 10px 3px;padding:26px 36px 28px 46px;background:var(--card);box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.45),2px 0 0 var(--card),3px 0 0 var(--bd),5px 1px 0 var(--card),6px 1px 0 var(--bd),0 12px 26px rgba(0,0,0,.25)}
.qd.open{font-weight:400;font-size:16px;color:var(--ink)}
.qd h3{font:italic 600 23px/1.2 Fraunces,Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 4px}
.qd .qx{right:12px;top:10px}.qd .qx .ic{width:18px;height:18px}
.qd .qb{position:absolute;left:40px;top:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 4px 6px 0;font-size:14px}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}

@keyframes gin{from{transform:perspective(1600px) rotateY(100deg);filter:brightness(.55);opacity:0}}

:root[data-skin=modern] .bau,:root[data-skin=creative] .bau{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:16px;letter-spacing:0}

/* ---------- ajustes finos da página do livro ---------- */
.sts{letter-spacing:0;display:inline-flex}.sts .st{font-size:19px;padding:0 1px;line-height:1}
.bfoot .bmeta{display:flex;align-items:flex-end;gap:12px}.bfoot .bmeta .bars{height:30px}
.ib{position:relative;width:36px;height:36px;display:inline-grid;place-items:center;padding:0;border:1px solid var(--bd);border-radius:10px;background:none;cursor:pointer;color:var(--ink);transition:border-color .2s,color .2s}
.tb .ib .ic{width:17px;height:17px}.ib:hover{border-color:var(--acc);color:var(--acc)}
.ib.on{background:var(--pl);color:var(--onpl);border-color:var(--pl)}.ib.on .ic{fill:currentColor}
.ib::after{content:attr(aria-label);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12px;font-weight:400;padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;transform:translateY(-3px);transition:opacity .15s,transform .15s;z-index:20}
.ib:hover::after,.ib:focus-visible::after{opacity:1;transform:none}
:root[data-skin=antique] .ib{border-radius:3px}
:root[data-skin=creative] .ib{border:2px solid var(--bd);border-radius:12px;box-shadow:3px 3px 0 var(--sh)}
.bmw{position:sticky;top:calc(var(--hh,64px) + env(safe-area-inset-top,0px));height:0;z-index:7}
.bmini{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:5px 14px;background:var(--card);border:1px solid var(--bd);border-top:0;border-radius:0 0 12px 12px;box-shadow:0 8px 18px rgba(0,0,0,.14);cursor:pointer;color:var(--ink);text-align:left;opacity:0;transform:translateY(-100%);pointer-events:none;transition:opacity .22s,transform .22s}
.bmini.on{opacity:1;transform:none;pointer-events:auto}
.bmini .mt{width:24px;height:34px;flex:none;position:relative;overflow:hidden;border-radius:2px 4px 4px 2px;box-shadow:0 2px 5px rgba(0,0,0,.35)}.bmini .mt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bmini b{font:600 15px Fraunces,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bmini span:not(.mt){font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* ---------- estudar / clube: botões iguais com dropdown ---------- */
.ddg{display:flex;gap:8px}
.bfoot .ddb{min-width:176px;justify-content:center;display:inline-flex;align-items:center;gap:7px}
.ddb .cv2{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 2px;opacity:.6;transition:transform .2s}
.ddb.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}.ddb.on .cv2{transform:rotate(-135deg);margin-top:3px}
.ddp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px 14px;margin:10px 0 6px;animation:ddin .22s ease}.ddp[hidden]{display:none}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}}
.ddp .cb>p{margin:0 0 6px}
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sblk{display:grid;gap:5px;align-content:start;text-align:left;padding:12px 13px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.sblk:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}
.sblk b{font:600 15px Fraunces,Georgia,serif;line-height:1.25}.sblk span{font-size:12.5px;line-height:1.35;color:var(--mut)}
@media(max-width:620px){.sg{grid-template-columns:repeat(2,minmax(0,1fr))}.bfoot .ddg{width:100%}.bfoot .ddb{min-width:0;flex:1}}
